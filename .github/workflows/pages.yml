name: Deploy production site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish production site
        shell: bash
        run: |
          set -euo pipefail

          worktree="$(mktemp -d)"
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages
            git worktree add "$worktree" origin/gh-pages
          else
            git worktree add --detach "$worktree"
            git -C "$worktree" switch --orphan gh-pages
            git -C "$worktree" rm -rf . >/dev/null 2>&1 || true
          fi

          find "$worktree" -mindepth 1 -maxdepth 1 ! -name previews -exec rm -rf {} +
          cp index.html "$worktree/index.html"
          touch "$worktree/.nojekyll"

          git -C "$worktree" config user.name "github-actions[bot]"
          git -C "$worktree" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$worktree" add -A

          if git -C "$worktree" diff --cached --quiet; then
            echo "No production changes to publish."
            exit 0
          fi

          git -C "$worktree" commit -m "Deploy production site"
          git -C "$worktree" push origin HEAD:gh-pages
